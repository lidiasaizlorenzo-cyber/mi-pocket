<style>
/* Layout: one mobile column, cards on a near-white blue ground, floating tab bar. */
:root{
  --bg:#F6F9FC; --surface:#FFFFFF; --soft:#F0F4F8; --line:#E2E9F1;
  --ink:#22303C; --muted:#5B6B7A;
  --accent:#3F6F9E; --on-accent:#FFFFFF; --accent-soft:#E2EDF8; --accent-ink:#2E5A84;
  --green-soft:#E4F2E9; --green-ink:#3A6E4F;
  --beige-soft:#F4EFE6; --beige-ink:#76593A;
  --danger:#B04646; --danger-soft:#F8E6E6; --shadow:0 10px 28px rgba(34,60,90,.10);
  --bar1:#9DC0E2; --bar3:#B9D9C4;
  --font-d:'Fraunces',Georgia,'Times New Roman',serif;
  --font-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171E; --surface:#19212A; --soft:#1F2832; --line:#2A3542;
  --ink:#E6EDF3; --muted:#9DAAB7;
  --accent:#86B3DE; --on-accent:#0E1A26; --accent-soft:#1F3246; --accent-ink:#A9CBEB;
  --green-soft:#1D3227; --green-ink:#94CDA9; --beige-soft:#2C2820; --beige-ink:#D8C29F;
  --danger:#E58585; --danger-soft:#3A2224; --shadow:0 10px 28px rgba(0,0,0,.35); --bar1:#4C7398; --bar3:#4E7A5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171E; --surface:#19212A; --soft:#1F2832; --line:#2A3542;
  --ink:#E6EDF3; --muted:#9DAAB7;
  --accent:#86B3DE; --on-accent:#0E1A26; --accent-soft:#1F3246; --accent-ink:#A9CBEB;
  --green-soft:#1D3227; --green-ink:#94CDA9; --beige-soft:#2C2820; --beige-ink:#D8C29F;
  --danger:#E58585; --danger-soft:#3A2224; --shadow:0 10px 28px rgba(0,0,0,.35); --bar1:#4C7398; --bar3:#4E7A5E; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 130px}
.serif{font-family:var(--font-d);font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)}
.view{display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--font-d);font-weight:600;font-size:30px;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--font-d);font-weight:600;font-size:20px;margin:0}
h3{font-size:15px;margin:0;font-weight:800}
.lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:6px}
.hero{background:var(--accent-soft);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:10px}
.hero .big{font-family:var(--font-d);font-weight:600;font-size:40px;line-height:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kv{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv>span:first-child{min-width:0}
.kv small{display:block;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-width:0}
.tile .v{font-family:var(--font-d);font-weight:600;font-size:18px}
.tile small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.pos{color:var(--green-ink)}
.neg{color:var(--danger)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface)}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:13px}
.legend div{display:flex;justify-content:space-between;gap:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:6px;vertical-align:1px}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.mnav{display:flex;gap:6px}
.ib{width:44px;height:44px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.link{background:none;border:0;padding:6px 0;color:var(--accent-ink);font-weight:800;font-size:14px;min-height:36px}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:12px;background:transparent;font-weight:800;font-size:14px;color:var(--muted);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(30,50,80,.10)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ef{background:var(--green-soft);color:var(--green-ink)}
.chip.est{background:var(--beige-soft);color:var(--beige-ink)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.gh{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:transparent;text-align:left;min-height:62px}
.gi{width:38px;height:38px;border-radius:13px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.gi.g{background:var(--green-soft);color:var(--green-ink)}
.gi.b{background:var(--beige-soft);color:var(--beige-ink)}
.gt{flex:1;min-width:0;display:flex;flex-direction:column}
.gt small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv{font-weight:800}
.chev{color:var(--muted);transition:transform .15s}
.gh[aria-expanded="true"] .chev{transform:rotate(180deg)}
.gb{padding:0 8px 8px}
.it{width:100%;display:flex;align-items:center;gap:10px;padding:9px 6px;border:0;background:transparent;text-align:left;border-top:1px solid var(--line);min-height:52px}
.st{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--on-accent)}
.st.ok{background:var(--accent);border-color:var(--accent)}
.itx{flex:1;min-width:0;display:flex;flex-direction:column}
.itx b{font-weight:700;font-size:14px}
.itx small{font-size:12px;color:var(--muted)}
.iv{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.iv b{font-size:14px}
.alert{background:var(--beige-soft);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.alert .t{font-weight:800;color:var(--beige-ink);display:flex;gap:8px;align-items:center}
.alert .row{font-size:14px}
.alert.blue{background:var(--accent-soft)}
.alert.blue .t{color:var(--accent-ink)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.strip div{border-radius:14px;padding:8px 0}
.strip .today{background:var(--accent-soft)}
.strip small{display:block;font-size:11px;font-weight:800;color:var(--muted)}
.strip i{display:block;height:6px;width:6px;border-radius:3px;margin:4px auto 0;background:transparent}
.strip i.on{background:var(--accent)}
.dayh{font-size:12px;font-weight:800;color:var(--muted);padding:10px 6px 2px;text-transform:capitalize}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0;text-align:left}
.mcard.hot{background:var(--accent-soft);border-color:transparent}
.mcard .row span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{min-height:46px;flex:1;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cbtn{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--ink)}
.cbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.cbtn.add{border-style:dashed;color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flabel{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.inp{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);padding:0 14px;font-size:16px;width:100%;box-sizing:border-box;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;background:var(--surface)}
textarea.inp{padding:10px 14px;min-height:120px;font-size:12px;font-family:ui-monospace,Menlo,monospace}

    items.push({key:'m:'+m.id,rec:null,mov:m,date:m.fecha,due:m.fecha,tipo:m.tipo,clase:m.tipo==='gasto'?(m.clase||'variable'):null,cat:m.tipo==='ahorro'?'Ahorro':(m.cat||'Otros'),nombre:m.nombre,amount:m.importe,paid:true,est:false,metodo:m.metodo,piso:m.piso||null,mesSig:!!m.mesSig,extra:!!m.extra});
  }
  items.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.nombre.localeCompare(b.nombre));
  items.forEach(i=>ITEMS[i.key]=i);

}
function totals(items){
  const t={ing:0,aho:0,fij:0,vari:0,pend:0,cob:0,bk:{i:0,o:0},ef:{i:0,o:0}};
  for(const i of items){const a=i.amount||0;
    if(i.tipo==='ingreso'){t.ing+=a;if(i.paid)t.cob+=a}else if(i.tipo==='ahorro')t.aho+=a;else if(i.clase==='fijo')t.fij+=a;else t.vari+=a;
    if(i.paid){const b=i.metodo==='efectivo'?t.ef:t.bk;if(i.tipo==='ingreso')b.i+=a;else b.o+=a}
    else if(i.tipo!=='ingreso')t.pend+=a;}
  t.libre=t.ing-t.aho-t.fij-t.vari;return t;
}
function avisos(today){
  const out=[];
  for(const r of Object.values(S.recs)){
    if(!r.aviso||r.activo===false)continue;const a=r.aviso;let target=null;
    if(isDate(a.fecha)){target=a.fecha;let g=0;while(target<today&&g++<40)target=addMD(target,12)}
    else target=nextOcc(r,today);
    if(!target)continue;if(r.fin&&target>r.fin)continue;
    const limite=addD(target,-(+a.dias||0)),desde=addD(limite,-(+a.margen||0));
    out.push({r,target,limite,desde,activo:today>=desde&&today<=limite&&a.visto!==target});
  }
  return out.sort((x,y)=>x.limite<y.limite?-1:1);
}

/* ---------- pisos ---------- */
const pisoById=id=>(S.cfg&&S.cfg.pisos||[]).find(p=>p.id===id);
function pisoGastos(pid,ym,mode){
  const rows=[];
  if(mode==='real'){
    for(const m of Object.values(S.movs))if(m.piso===pid&&m.tipo==='gasto'&&ymOf(m.fecha)===ym)
      rows.push({nombre:m.nombre,sub:(m.extra?'Extraordinario · ':'')+'Pagado el '+dLabel(m.fecha),amount:m.importe,id:m.id});
    return rows;
  }
  const usedMov=new Set();
  for(const r of Object.values(S.recs)){
    if(r.piso!==pid||r.tipo!=='gasto'||rk(r).unit==='semana'||rk(r).unit==='dia')continue;
    for(let j=-13;j<=13;j++){
      for(const d of occ(r,addM(ym,j))){
        const m=OCC[r.id+'@'+d];if(m&&m.extra)continue;
        const [a,b]=m?movPeriod(m):recPeriod(r,d),s=share(a,b,ym);if(s<=0)continue;
        if(m)usedMov.add(m.id);const total=m?m.importe:(r.importe||0),span=monthsSpan(a,b).length;
        rows.push({nombre:r.nombre,sub:span>1?(num(total)+' € · '+periodTxt(a,b)+(m?'':' · estimado')):(m?'Pagado el '+dLabel(m.fecha):'Pendiente'+(r.estimado?' · estimado':'')),amount:total*s,est:!m});
      }
    }
  }
  for(const m of Object.values(S.movs)){
    if(m.piso!==pid||m.tipo!=='gasto'||m.extra||usedMov.has(m.id))continue;
    if(m.occ){const [rid,d]=m.occ.split('@');const r=S.recs[rid];if(r&&occ(r,ymOf(d)).includes(d))continue}
    const [a,b]=movPeriod(m),s=share(a,b,ym);
    if(s>0)rows.push({nombre:m.nombre,sub:monthsSpan(a,b).length>1?num(m.importe)+' € · '+periodTxt(a,b):'Pagado el '+dLabel(m.fecha),amount:m.importe*s});
  }
  return rows;
}
function pisoCalc(p,ym,mode){const g=pisoGastos(p.id,ym,mode),gs=g.reduce((s,r)=>s+r.amount,0),inv=p.uso!=='vivienda';
  const alq=inv?alqFor(p,ym):0,com=alq*(p.comision||0)/100;return{rows:g,gastos:gs,com,alq,neto:alq-com,benef:alq-com-gs}}
function hipo(p){const c=p.compra||{},P=+c.hipImporte||0,n=Math.round((+c.hipAnios||0)*12),i=(+c.hipInteres||0)/100/12;if(!P||!n)return null;
  const cuota=i?P*i/(1-Math.pow(1+i,-n)):P/n,ini=c.hipInicio||ymOf(c.fecha||todayStr());
  const pend=k=>{k=Math.max(0,Math.min(n,k));return i?P*Math.pow(1+i,k)-cuota*(Math.pow(1+i,k)-1)/i:P-cuota*k};
  const k=mdiff(ini,ymOf(todayStr()))+1;return{P,n,cuota,ini,fin:addM(ini,n-1),pagadas:Math.max(0,Math.min(n,k)),pendiente:Math.max(0,pend(k)),amort12:Math.max(0,pend(k)-pend(k+12))}}
const extrasOf=pid=>Object.values(S.movs).filter(m=>m.piso===pid&&m.extra).sort((a,b)=>a.fecha<b.fecha?1:-1);
function alqFor(p,ym){const h=(p.alquileres||[]).filter(x=>x&&x.desde&&mdiff(x.desde,ym)>=0).sort((a,b)=>a.desde<b.desde?-1:1);return h.length?(+h[h.length-1].importe||0):(+p.alquiler||0)}
function alqHistTxt(p){const h=(p.alquileres||[]).slice().sort((a,b)=>a.desde<b.desde?1:-1);return h.length>1?h.map(x=>num(x.importe)+' desde '+mShort(x.desde)).join(' · '):''}
function pisoStart(p){const ms=Object.values(S.movs).filter(m=>m.piso===p.id&&m.tipo==='ingreso').map(m=>acctYM(m)).sort();return p.desdeApp||ms[0]||ymOf(todayStr())}

function baseline(sn,range){if(sn.length<2)return null;const last=sn[sn.length-1];if(range==='todo')return sn[0];
  const months={mes:1,'6m':6,'1a':12}[range]||6,cut=addMD(last.fecha,-months);let b=null;for(const s of sn){if(s.fecha<=cut)b=s}return b||sn[0]}

  const arch=hs.filter(x=>x.archivada).length;if(arch)h+=`<div class="lrow muted" style="font-size:13px">${arch} ${arch===1?'hucha archivada':'huchas archivadas'} · su histórico se guarda</div>`;

function chart(sn){
  if(sn.length<2)return'';const W=320,H=110,px=14,py=12,vals=sn.map(snapTotal),mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
  const t0=parseD(sn[0].fecha).getTime(),t1=parseD(sn[sn.length-1].fecha).getTime();
  const pts=sn.map((s,k)=>[px+(W-2*px)*((parseD(s.fecha).getTime()-t0)/((t1-t0)||1)),py+(H-30-py)*(1-(vals[k]-mn)/rg)]);
  const pl=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg class="chart" width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del patrimonio de ${eur(vals[0])} a ${eur(vals[vals.length-1])}"><polyline points="${pl}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,k)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${k===pts.length-1?5:3.5}" fill="${k===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join('')}<text x="${px}" y="${H-6}">${dLabel(sn[0].fecha)}</text><text x="${W-px}" y="${H-6}" text-anchor="end">${dLabel(sn[sn.length-1].fecha)}</text></svg>`;
}

/* ---------- Ajustes: copias y errores ---------- */
function diagnose(){
  const out=[],cfg=S.cfg,today=todayStr(),allCats=new Set([...cfg.cats.fijo,...cfg.cats.variable,...cfg.cats.ingreso]),pids=new Set((cfg.pisos||[]).map(p=>p.id)),hids=new Set((cfg.huchas||[]).map(h=>h.id));
  const add=(lv,txt,fix)=>out.push({lv,txt,fix});
  for(const r of Object.values(S.recs)){
    if(!r.nombre)add('e','Hay un programado sin nombre.',{a:'editrec',id:r.id});
    if(r.tipo!=='ahorro'&&!r.cat)add('a',`«${r.nombre}» no tiene categoría.`,{a:'editrec',id:r.id});
    if(r.cat&&r.tipo!=='ahorro'&&!allCats.has(r.cat))add('a',`La categoría «${r.cat}» de «${r.nombre}» no está en tu lista.`,{a:'addcatfix',v:r.cat,t:r.tipo==='ingreso'?'ingreso':(r.clase||'fijo')});
    if(r.activo!==false&&!r.importe&&r.freq!=='unica')add('a',`«${r.nombre}» no tiene importe.`,{a:'editrec',id:r.id});
    if(r.piso&&!pids.has(r.piso))add('e',`«${r.nombre}» está asignado a un piso que ya no existe.`,{a:'editrec',id:r.id});
    if(r.hucha&&!hids.has(r.hucha))add('a',`«${r.nombre}» va a una hucha que no existe.`,{a:'editrec',id:r.id});
    if(r.fin&&r.inicio&&ymOf(r.fin)<r.inicio)add('e',`«${r.nombre}» termina antes de empezar.`,{a:'editrec',id:r.id});
    if(r.activo!==false&&r.fin&&r.fin<today&&r.freq!=='unica')add('i',`«${r.nombre}» ya terminó el ${dFull(r.fin)}.`,{a:'editrec',id:r.id});
  }
  const byOcc={};
  for(const m of Object.values(S.movs)){
    if(!isDate(m.fecha))add('e',`«${m.nombre}» tiene una fecha no válida.`,{a:'editmov',id:m.id});
    if(!(m.importe>0))add('e',`«${m.nombre}» tiene importe 0 o negativo.`,{a:'editmov',id:m.id});
    if(m.piso&&!pids.has(m.piso))add('e',`El pago «${m.nombre}» es de un piso que ya no existe.`,{a:'editmov',id:m.id});
    if(m.desde&&m.hasta&&effEnd(m.desde,m.hasta)<m.desde)add('e',`El periodo de «${m.nombre}» termina antes de empezar.`,{a:'editmov',id:m.id});
    if(m.cat&&m.tipo!=='ahorro'&&!allCats.has(m.cat))add('a',`La categoría «${m.cat}» de «${m.nombre}» no está en tu lista.`,{a:'addcatfix',v:m.cat,t:m.tipo==='ingreso'?'ingreso':(m.clase||'variable')});
    if(m.occ){(byOcc[m.occ]=byOcc[m.occ]||[]).push(m);if(m.rec&&!S.recs[m.rec])add('i',`El pago «${m.nombre}» del ${dLabel(m.fecha)} venía de un programado que borraste.`,{a:'unlink',id:m.id})}
  }
  for(const k in byOcc)if(byOcc[k].length>1)add('e',`«${byOcc[k][0].nombre}» está marcado como pagado ${byOcc[k].length} veces para el mismo cargo.`,{a:'editmov',id:byOcc[k][1].id});
  for(const s of Object.values(S.saldos))for(const id in (s.valores||{}))if(!hids.has(id)){add('a',`El saldo del ${dFull(s.fecha)} incluye una hucha que ya no existe.`);break}
  return out;
}

  h+=`</section><p class="muted" style="text-align:center;font-size:12px;margin:0">Mi Pocket · versión ${APP_VERSION}</p>`;
  return h;

function buildBackup(){return{app:'mis-finanzas',version:APP_VERSION,exportado:new Date().toISOString(),config:S.cfg,recurrentes:Object.values(S.recs),movimientos:Object.values(S.movs),saldos:Object.values(S.saldos)}}
function validBackup(o){return o&&o.app==='mis-finanzas'&&o.config&&o.config.cats&&Array.isArray(o.recurrentes)&&Array.isArray(o.movimientos)&&Array.isArray(o.saldos)}
async function restore(o){
  const plan=[];const ids={recurrentes:new Set(),movimientos:new Set(),saldos:new Set()};
  o.recurrentes.forEach(r=>{if(r&&r.id){ids.recurrentes.add(r.id);plan.push(['recurrentes',r.id,r])}});
  o.movimientos.forEach(m=>{if(m&&m.id){ids.movimientos.add(m.id);plan.push(['movimientos',m.id,m])}});
  o.saldos.forEach(s=>{if(s&&isDate(s.fecha)){ids.saldos.add(s.fecha);plan.push(['saldos',s.fecha,s])}});
  const dels=[];Object.keys(S.recs).forEach(id=>{if(!ids.recurrentes.has(id))dels.push(['recurrentes',id])});Object.keys(S.movs).forEach(id=>{if(!ids.movimientos.has(id))dels.push(['movimientos',id])});Object.keys(S.saldos).forEach(id=>{if(!ids.saldos.has(id))dels.push(['saldos',id])});
  S.cfg=o.config;S.recs={};S.movs={};S.saldos={};plan.forEach(([c,id,d])=>{S[COL[c]][id]=d});buildOcc();render();
  if(S.local){saveLocal();toast('Copia importada');return}
  if(!S.db)return;
  const jobs=[()=>S.db.doc('config/main').set(o.config),...plan.map(([c,id,d])=>()=>S.db.doc(c+'/'+id).set(d)),...dels.map(([c,id])=>()=>S.db.doc(c+'/'+id).delete())];
  let fails=0;for(let i=0;i<jobs.length;i+=8){const r=await Promise.allSettled(jobs.slice(i,i+8).map(f=>f()));fails+=r.filter(x=>x.status==='rejected').length}
  if(fails){logErr('Importar: '+fails+' escrituras fallaron','importar');toast('Copia importada con '+fails+' errores. Vuelve a importarla.')}else toast('Copia importada');
}

          <div class="field"><label for="f-avisoFecha">Fecha de renovación o permanencia (opcional)</label><input class="inp" type="date" id="f-avisoFecha" data-f="avisoFecha" value="${esc(f.avisoFecha)}"></div>`;
          const pr=avisoPreview();if(pr)h+=`<div class="note">${pr}</div>`;

  h+=`<button class="btn" data-action="save">${ctx==='occ'&&f.pagado==='si'?(ing?'Guardar y marcar cobrado':'Guardar y marcar pagado'):'Guardar'}</button>`;
  if(ctx==='mov')h+=`<button class="btn3" data-action="delmov">Borrar este pago</button>`;

  if(ctx==='rec'&&f.recId)h+=togF('activo','Activo','Si lo pausas deja de salir en la previsión')+`<button class="btn3" data-action="delrec">Borrar programado</button>`;
  return h;
}
function avisoPreview(){const f=form,dias=parseInt(f.avisoDias,10)||0,mg=parseInt(f.avisoMargen,10)||0,today=todayStr();
  let target=isDate(f.avisoFecha)?f.avisoFecha:null;
  if(target){let g=0;while(target<today&&g++<40)target=addMD(target,12)}
  else if(isDate(f.fecha))target=f.fecha>=today?f.fecha:null;
  if(!target)return'';const lim=addD(target,-dias),from=addD(lim,-mg);
  return `Te avisaré desde el <b>${dFull(from)}</b> para que decidas antes del <b>${dFull(lim)}</b> (renueva el ${dFull(target)}).`}

function descFrom(f){const tipo=f.tipo;return{nombre:(f.nombre||'').trim(),tipo,clase:tipo==='gasto'?(f.clase||'variable'):null,cat:tipo==='ahorro'?null:(f.cat||catList()[0]||'Otros'),hucha:tipo==='ahorro'?(f.hucha||null):null,metodo:f.metodo||'banco',piso:f.piso||null,mesSig:tipo==='ingreso'&&!!f.mesSig}}
function periodFields(f){if(f.tipo!=='gasto'||f.extra||!f.cubreOn)return{desde:null,hasta:null,cubre:1};const n=monthsSpan(f.desde,f.hasta).length;return{desde:f.desde,hasta:f.hasta,cubre:Math.max(1,n)}}
function recFrom(f,base,anchor,reanchor){
  const r={...(base?clone(base):{}),...descFrom(f)};r.importe=pnum(f.importe);r.activo=f.activo!==false;r.estimado=!!f.estimado;
  if(f.repite){
    const every=Math.max(1,parseInt(f.every,10)||1),unit=f.unit||'mes';
    const changed=!base||base.freq==='unica'||rk(base).every!==every||rk(base).unit!==unit;
    r.freq='custom';r.every=every;r.unit=unit;delete r.fecha;
    if(reanchor||changed){r.inicio=ymOf(anchor);r.dia=+anchor.slice(8);r.ancla=anchor}
    r.fin=f.finOn&&isDate(f.fin)?f.fin:null;
    if(f.tipo==='gasto'&&!f.extra&&f.cubreOn){const ms=monthsSpan(f.desde,f.hasta);r.cubre=Math.max(1,ms.length);r.cubreDir=ms.length&&mdiff(ms[ms.length-1],ymOf(anchor))>=0?'antes':'despues'}else{r.cubre=1;r.cubreDir='antes'}
    r.aviso=f.tipo==='gasto'&&f.avisoOn?{dias:Math.max(0,parseInt(f.avisoDias,10)||0),margen:Math.max(0,parseInt(f.avisoMargen,10)||0),fecha:isDate(f.avisoFecha)?f.avisoFecha:null,visto:base&&base.aviso?base.aviso.visto||null:null}:null;
  }else{r.freq='unica';r.fecha=anchor;r.fin=null;r.aviso=null}
  return r}
function validate(f){if(!(f.nombre||'').trim()){toast('Pon un concepto');return false}if(!isDate(f.fecha)){toast('Elige la fecha');return false}
  if(f.tipo==='gasto'&&!f.extra&&f.cubreOn&&!monthsSpan(f.desde||'',f.hasta||'').length){toast('Revisa el periodo: «Hasta» tiene que ser después de «Desde»');return false}
  if(f.repite&&f.finOn&&!isDate(f.fin)){toast('Elige la fecha de fin o quita «Termina en una fecha»');return false}return true}
function doSave(){
  const f=form;if(!validate(f))return;const imp=pnum(f.importe),pf=periodFields(f),d=descFrom(f);
  const needAmount=f.ctx==='new'||f.ctx==='mov'||(f.ctx==='occ'&&f.pagado==='si');if(needAmount&&!imp){toast('Pon el importe');return}
  if(f.ctx==='new'){
    let recId=null;
    if(f.repite){recId=uid();put('recurrentes',recId,{id:recId,...recFrom(f,null,f.fecha,true)})}
    else if(f.pagado==='no'){recId=uid();put('recurrentes',recId,{id:recId,...recFrom({...f,repite:false},null,f.fecha,true)})}
    if(f.pagado!=='no'){const id=uid();put('movimientos',id,{id,...d,extra:!!(f.piso&&f.extra&&f.tipo==='gasto'),fecha:f.fecha,importe:imp,...pf,rec:recId,occ:recId?recId+'@'+f.fecha:null})}
    closeSheet();toast(f.pagado==='no'?'Apuntado en tu previsión':'Movimiento guardado');return}
  if(f.ctx==='mov'){
    const m0=S.movs[f.movId];if(!m0){closeSheet();return}let r=f.recId&&S.recs[f.recId];
    const m={...clone(m0),...d,extra:!!(f.piso&&f.extra&&f.tipo==='gasto'),fecha:f.fecha,importe:imp,...pf};
    if(r){if(f.repite)put('recurrentes',r.id,{id:r.id,...recFrom(f,r,f.due,false)});else put('recurrentes',r.id,{...clone(r),...d,fin:f.due})}
    else if(f.repite){const id=uid();const nr={id,...recFrom(f,null,f.fecha,true)};put('recurrentes',id,nr);m.rec=id;m.occ=id+'@'+f.fecha}
    put('movimientos',m.id,m);closeSheet();toast('Guardado');return}
  if(f.ctx==='occ'){
    const r=S.recs[f.recId];if(!r){closeSheet();return}
    const nr=f.repite?{id:r.id,...recFrom(f,r,f.due,false)}:{...clone(r),...descFrom(f),importe:imp||r.importe,fin:f.due,estimado:!!f.estimado};
    if(f.pagado==='si'){const id=uid();put('movimientos',id,{id,...d,fecha:f.fecha,importe:imp,...pf,rec:r.id,occ:r.id+'@'+f.due});nr.importe=imp}
    put('recurrentes',r.id,nr);closeSheet();toast(f.pagado==='si'?(f.tipo==='ingreso'?'Marcado como cobrado':'Marcado como pagado'):'Guardado');return}
  if(f.ctx==='rec'){
    const base=f.recId&&S.recs[f.recId],id=f.recId||uid();
    put('recurrentes',id,{id,...recFrom(f,base,f.fecha,true)});closeSheet();toast('Programado guardado');return}
}

  addcat(){const n=(form.newCatName||'').trim();if(!n){toast('Escribe un nombre para la categoría');return}
    const c=clone(S.cfg),key=form.tipo==='ingreso'?'ingreso':(form.clase||'variable');if(!c.cats[key].includes(n))c.cats[key].push(n);
    form.cat=n;form.newCat=false;form.newCatName='';saveCfg(c);renderSheet()},
  item(el){const i=ITEMS[el.dataset.key];if(!i)return;
    if(i.paid&&i.mov){openSheet('edit',formFromMov(i.mov));return}
    openSheet('edit',formFromOcc(i.rec,i.due))},
  editmov(el){const m=S.movs[el.dataset.id];if(m)openSheet('edit',formFromMov(m))},
  save(){doSave()},
  delmov(el){if(!confirm2(el,'Toca otra vez para borrar'))return;del('movimientos',form.movId);closeSheet();toast('Pago borrado')},
  skip(){const r=S.recs[form.recId];if(!r)return;put('recurrentes',r.id,{...clone(r),skip:[...(r.skip||[]),form.due]});closeSheet();toast('Cargo saltado')},
  newrec(){openSheet('edit',formFromRec(null))},
  editrec(el){const r=S.recs[el.dataset.id];if(r)openSheet('edit',formFromRec(r));else toast('Ese programado ya no existe')},
  delrec(el){if(!confirm2(el,'Toca otra vez para borrar la serie'))return;del('recurrentes',form.recId);closeSheet();toast('Programado borrado. Los pagos ya hechos se mantienen.')},
  avisook(el){const r=S.recs[el.dataset.id];if(!r||!r.aviso)return;put('recurrentes',r.id,{...clone(r),aviso:{...clone(r.aviso),visto:el.dataset.v}});toast('Perfecto, te volveré a avisar en la siguiente renovación')},
  newpiso(){openSheet('piso',{uso:'inversion',nombre:'',alquiler:'',comision:'',benefPrevio:'',cfecha:'',precio:'',gastos:'',hipImporte:'',hipAnios:'',hipInteres:'',hipInicio:''})},
  editpiso(el){const p=pisoById(el.dataset.id);if(!p)return;const c=p.compra||{},n=v=>v?String(v).replace('.',','):'';
    openSheet('piso',{id:p.id,uso:p.uso||'inversion',nombre:p.nombre,alquiler:n(p.alquiler),comision:n(p.comision),benefPrevio:n(p.benefPrevio),cfecha:c.fecha||'',precio:n(c.precio),gastos:n(c.gastos),hipImporte:n(c.hipImporte),hipAnios:n(c.hipAnios),hipInteres:n(c.hipInteres),hipInicio:c.hipInicio||''})},
  savepiso(){const f=form,n=(f.nombre||'').trim();if(!n){toast('Pon un nombre');return}
    const c=clone(S.cfg),old=f.id?c.pisos.find(x=>x.id===f.id)||{}:{};
    const id=f.id||((n.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'piso')+'-'+uid().slice(-4));
    const p={...old,id,nombre:n,uso:f.uso||'inversion',alquiler:pnum(f.alquiler),comision:pnum(f.comision),benefPrevio:pnum(f.benefPrevio),
      compra:{fecha:isDate(f.cfecha)?f.cfecha:null,precio:pnum(f.precio),gastos:pnum(f.gastos),hipImporte:pnum(f.hipImporte),hipAnios:pnum(f.hipAnios),hipInteres:pnum(f.hipInteres),hipInicio:/^\d{4}-\d{2}$/.test(f.hipInicio||'')?f.hipInicio:null}};
    const hist=(old.alquileres||[]).filter(x=>x&&x.desde);
    if(p.uso!=='vivienda'&&(p.alquiler!==(+old.alquiler||0)||/^\d{4}-\d{2}$/.test(f.alqDesde||''))){
      if(!hist.length&&old.alquiler&&p.alquiler!==+old.alquiler)hist.push({desde:'2000-01',importe:+old.alquiler});
      const desde=/^\d{4}-\d{2}$/.test(f.alqDesde||'')?f.alqDesde:ymOf(todayStr());const j=hist.findIndex(x=>x.desde===desde);
      if(j>=0)hist[j].importe=p.alquiler;else hist.push({desde,importe:p.alquiler});hist.sort((a,b)=>a.desde<b.desde?-1:1);p.alquiler=hist[hist.length-1].importe}
    p.alquileres=hist;
    const k=c.pisos.findIndex(x=>x.id===id);if(k>=0)c.pisos[k]=p;else c.pisos.push(p);saveCfg(c);closeSheet();toast('Piso guardado')},
  delpiso(el){if(!confirm2(el,'Toca otra vez para borrar el piso'))return;const c=clone(S.cfg);c.pisos=c.pisos.filter(x=>x.id!==form.id);saveCfg(c);closeSheet();S.ui.tab='pisos';render()},
  saldos(){const sn=snaps(),last=sn[sn.length-1],f={fecha:todayStr()};(S.cfg.huchas||[]).forEach(x=>{if(last&&last.valores&&last.valores[x.id]!=null)f['h:'+x.id]=num(last.valores[x.id])});openSheet('saldos',f)},
  editsaldo(el){const s=S.saldos[el.dataset.v];if(!s)return;const f={fecha:s.fecha,edit:s.fecha};(S.cfg.huchas||[]).forEach(x=>{if(s.valores&&s.valores[x.id]!=null)f['h:'+x.id]=num(s.valores[x.id])});openSheet('saldos',f)},
  savesaldos(){const f=form;if(!isDate(f.fecha)){toast('Elige la fecha');return}const src=f.edit?S.saldos[f.edit]:snaps().slice(-1)[0];
    const valores={...(src?clone(src.valores||{}):{})};(S.cfg.huchas||[]).filter(x=>!x.archivada).forEach(x=>{valores[x.id]=pnum(f['h:'+x.id])});
    if(f.edit&&f.edit!==f.fecha)del('saldos',f.edit);put('saldos',f.fecha,{fecha:f.fecha,valores});closeSheet();toast('Saldos guardados')},
  delsaldo(el){if(!confirm2(el,'Toca otra vez para borrar'))return;del('saldos',form.edit);closeSheet()},
  huchas(){openSheet('huchas',{list:clone(S.cfg.huchas||[])})},
  addhucha(){form.list.push({id:'h-'+uid().slice(-6),nombre:'',archivada:false});renderSheet()},
  savehuchas(){const c=clone(S.cfg);c.huchas=form.list.filter(x=>(x.nombre||'').trim()).map(x=>({id:x.id,nombre:x.nombre.trim(),archivada:!!x.archivada}));saveCfg(c);closeSheet();toast('Huchas guardadas')},
  async export(){const txt=JSON.stringify(buildBackup(),null,1),dl=await getDl(),name='mi-pocket-'+todayStr()+'.json';
    if(dl){try{await dl.save({filename:name,data:txt});toast('Copia descargada')}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('Espera un momento y vuelve a intentarlo');return}logErr('Exportar: '+(e&&(e.code||e.message)),'exportar');openSheet('export',{txt})}}
    else openSheet('export',{txt})},
  copyexp(){const t=document.getElementById('f-exp');const fb=()=>{t.focus();t.select();toast('Selecciona y copia el texto')};
    try{navigator.clipboard.writeText(form.txt).then(()=>toast('Copiado'),fb)}catch(_){fb()}},
  import(){document.getElementById('importfile').click()},
  doimport(el){if(!confirm2(el,'Toca otra vez para sustituir tus datos'))return;const o=form.data;closeSheet();restore(o)},
  diag(){S.ui.diag=diagnose();render()},
  seemonth(el){S.ui.month=el.dataset.v;S.ui.tab='inicio';window.scrollTo(0,0);render()},
  dlmonth(el){const m=el.dataset.v;return downloadReport([m],'Mi Pocket '+mLong(m)+'.xlsx')},
  dlall(){const ms=histMonths().slice().reverse();return downloadReport(ms,'Mi Pocket '+todayStr().slice(0,4)+'.xlsx')},
  unlink(el){const m=S.movs[el.dataset.id];if(!m)return;const n={...clone(m)};delete n.rec;delete n.occ;put('movimientos',m.id,n);S.ui.diag=null;setTimeout(()=>{S.ui.diag=diagnose();render()},50)},
  addcatfix(el){const c=clone(S.cfg),k=el.dataset.t;if(c.cats[k]&&!c.cats[k].includes(el.dataset.v))c.cats[k].push(el.dataset.v);saveCfg(c);setTimeout(()=>{S.ui.diag=diagnose();render()},50)},
  clearerr(){ERRS.length=0;try{if(S.local)localStorage.setItem(LSERR,'[]')}catch(_){}if(S.db)S.db.doc('sistema/errores').set({items:[]}).catch(()=>{});render()},
  copyerr(){const t=ERRS.map(e=>e.t+' '+e.msg+(e.src?' ('+e.src+')':'')).join('\n');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Errores copiados'),()=>toast('No se ha podido copiar'))}
};
document.addEventListener('click',e=>{
  const w=document.getElementById('sheetw');if(e.target===w){closeSheet();return}
  const el=e.target.closest('[data-action]');if(!el)return;const fn=A[el.dataset.action];if(fn){e.preventDefault();try{const r=fn(el);if(r&&r.catch)r.catch(err=>logErr(err&&err.message,el.dataset.action))}catch(err){logErr(err.message,'acción '+el.dataset.action);toast('Algo ha fallado. Lo tienes en Ajustes › Errores.')}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});

/* ---------- boot ---------- */
async function boot(){
  render();
  const c=window.claude;let db=null;
  try{db=c&&c.use?await c.use('db'):null}catch(_){db=null}
  if(!db){
    S.local=true;Object.keys(S.got).forEach(k=>S.got[k]=true);
    try{const raw=localStorage.getItem(LSKEY);if(raw){const d=JSON.parse(raw);S.cfg=d.cfg||null;S.recs=d.recs||{};S.movs=d.movs||{};S.saldos=d.saldos||{}}}catch(e){logErr('Leer datos guardados: '+e.message,'arranque')}
    try{const er=JSON.parse(localStorage.getItem(LSERR)||'[]');er.forEach(e=>{if(!ERRS.find(x=>x.t===e.t&&x.msg===e.msg))ERRS.push(e)});ERRS.sort((a,b)=>a.t<b.t?1:-1)}catch(_){}
    buildOcc();render();return}
  S.db=db;
  const fail=e=>{logErr('Conexión: '+(e&&e.code),'db');if(e&&e.code==='revoked')toast('Ya no tienes acceso a estos datos.')};
  db.doc('config/main').onSnapshot(s=>{S.cfg=s.exists?clone(s.data()):null;S.got.cfg=true;render()},fail);
  const sub=(col,key)=>db.collection(col).onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]={...clone(d.data()),id:col==='saldos'?undefined:d.id};if(col==='saldos')delete o[d.id].id});S[key]=o;buildOcc();S.got[key]=true;render()},fail);
  sub('recurrentes','recs');sub('movimientos','movs');sub('saldos','saldos');
  db.doc('sistema/errores').get().then(s=>{if(s.exists){const it=(s.data().items||[]);it.forEach(e=>{if(!ERRS.find(x=>x.t===e.t&&x.msg===e.msg))ERRS.push(e)});ERRS.sort((a,b)=>a.t<b.t?1:-1);if(ERRS.length>30)ERRS.length=30}}).catch(()=>{});
}
boot();
})();
</script>
